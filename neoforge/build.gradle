plugins {
    id 'com.gradleup.shadow'
}

// NeoForge for 1.20.1 is a Forge build: the module then builds a Forge jar (see targets/1.20.properties).
def onForge = rootProject.neoforge_platform == 'forge'

architectury {
    platformSetupLoomIde()
    if (onForge) {
        forge()
    } else {
        neoForge()
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    (onForge ? developmentForge : developmentNeoForge).extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    if (onForge) {
        forge "net.neoforged:forge:$rootProject.neoforge_version"
    } else {
        neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    }
    compileOnly "io.github.llamalad7:mixinextras-common:0.5.0"
    if (rootProject.obfuscated) {
        common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    } else {
        common(project(path: ':common')) { transitive false }
    }
    shadowBundle project(path: ':common', configuration: onForge ? 'transformProductionForge' : 'transformProductionNeoForge')
    // NeoForge brings MixinExtras along, but in some of its builds (20.5, 21.0) one from before @WrapMethod, and Forge
    // brings none; the newest copy among the loaded mods is the one used.
    if (rootProject.findProperty('bundle_mixinextras') == 'true') {
        include "io.github.llamalad7:mixinextras-${onForge ? 'forge' : 'neoforge'}:0.5.0"
    }
    // Forge's dev runs need it on the class path too.
    if (onForge) {
        implementation "io.github.llamalad7:mixinextras-forge:0.5.0"
    }
}

base {
    archivesName = "$rootProject.archives_name-$project.name-mc${rootProject.findProperty('neoforge_jar_range') ?: rootProject.minecraft_range}"
}

processResources {
    def tokens = [
        version: project.version,
        neoforge_range: rootProject.neoforge_range,
        neoforge_minecraft_range: rootProject.neoforge_minecraft_range
    ]
    inputs.properties tokens
    // Forge reads its biome modifiers from data/<namespace>/forge (in src/compat/1.20). A dev run counts this module's
    // resources as a mod of their own, which Forge refuses without pack metadata, so the common module's comes along.
    if (onForge) {
        exclude 'data/*/neoforge/**'
        from(rootProject.file("common/src/compat/${rootProject.target}/resources")) {
            include 'pack.mcmeta'
        }
    }

    filesMatching('META-INF/neoforge.mods.toml') {
        expand tokens
        // Before 20.5 NeoForge reads META-INF/mods.toml, where a required dependency is `mandatory`.
        if (rootProject.findProperty('neoforge_mods_toml') == 'true') {
            filter { it.replace('type = "required"', 'mandatory = true') }
            path = 'META-INF/mods.toml'
        }
        // Forge's own mod id is forge, and it finds mixin configs in the jar manifest (see loom.forge below).
        if (onForge) {
            filter { it.replace('modId = "neoforge"', 'modId = "forge"') }
        }
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // NeoForge runs on Mojang names, so the Fabric refmap must not come along; Forge runs on SRG names and Loom
    // remaps the refmap for it.
    if (!onForge) {
        exclude 'bluestone-refmap.json'
    }
}

if (onForge) {
    loom {
        forge {
            mixinConfig 'bluestone.mixins.json'
            mixinConfig 'bluestone-optional.mixins.json'
        }
    }
}

if (rootProject.obfuscated) {
    shadowJar {
        archiveClassifier = 'dev-shadow'
    }
    remapJar {
        input.set shadowJar.archiveFile
    }
    loom {
        mixin {
            useLegacyMixinAp = false
        }
    }
} else {
    jar {
        archiveClassifier = 'raw'
    }
    shadowJar {
        archiveClassifier = null
    }
    assemble.dependsOn shadowJar
}
