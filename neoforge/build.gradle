plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    compileOnly "io.github.llamalad7:mixinextras-common:0.5.0"
    if (rootProject.obfuscated) {
        common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    } else {
        common(project(path: ':common')) { transitive false }
    }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
    // NeoForge brings MixinExtras along, but in some of its builds (20.5, 21.0) one from before @WrapMethod; the
    // newest copy among the loaded mods is the one used.
    if (rootProject.findProperty('bundle_mixinextras') == 'true') {
        include "io.github.llamalad7:mixinextras-neoforge:0.5.0"
    }
}

processResources {
    def tokens = [
        version: project.version,
        neoforge_range: rootProject.neoforge_range,
        neoforge_minecraft_range: rootProject.neoforge_minecraft_range
    ]
    inputs.properties tokens

    filesMatching('META-INF/neoforge.mods.toml') {
        expand tokens
        // Before 20.5 NeoForge reads META-INF/mods.toml, where a required dependency is `mandatory`.
        if (rootProject.findProperty('neoforge_mods_toml') == 'true') {
            filter { it.replace('type = "required"', 'mandatory = true') }
            path = 'META-INF/mods.toml'
        }
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // NeoForge runs on Mojang names, so the Fabric refmap must not come along.
    exclude 'bluestone-refmap.json'
}

if (rootProject.obfuscated) {
    shadowJar {
        archiveClassifier = 'dev-shadow'
    }
    remapJar {
        input.set shadowJar.archiveFile
    }
    loom {
        mixin {
            useLegacyMixinAp = false
        }
    }
} else {
    jar {
        archiveClassifier = 'raw'
    }
    shadowJar {
        archiveClassifier = null
    }
    assemble.dependsOn shadowJar
}
