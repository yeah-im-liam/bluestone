pluginManagement {
    repositories {
        maven { url "https://maven.fabricmc.net/" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.neoforged.net/releases/" }
        gradlePluginPortal()
    }
}

rootProject.name = 'bluestone'

// Only the loaders the chosen target builds for (see targets/).
def target = startParameter.projectProperties.target ?: default_target
def targetProperties = new Properties()
file("targets/${target}.properties").withInputStream { targetProperties.load(it) }
include 'common'
targetProperties.platforms.split(',').each { include it.trim() }
