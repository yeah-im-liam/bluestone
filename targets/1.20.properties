# Minecraft 1.20 and 1.20.1, built against the newer of them. Java 17, like the game. NeoForge for 1.20.1 is a Forge
# build (net.neoforged:forge), so the neoforge module builds a Forge jar, which runs on NeoForge and Forge 1.20.1.
minecraft_version=1.20.1
minecraft_range=1.20-1.20.1
java_version=17
obfuscated=true
platforms=fabric,neoforge
neoforge_platform=forge
compat=1.20 classic
neoforge_mods_toml=true
# There is no NeoForge for 1.20 itself.
neoforge_jar_range=1.20.1

fabric_loader_version=0.18.2
fabric_api_version=0.92.12+1.20.1
neoforge_version=1.20.1-47.1.106
modmenu_version=7.2.2

fabric_loader_min=0.16.14
fabric_minecraft_range=>=1.20 <1.20.2
neoforge_range=[47,)
# Forge brings no MixinExtras of its own.
bundle_mixinextras=true
neoforge_minecraft_range=[1.20.1,1.20.2)
