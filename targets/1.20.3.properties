# Minecraft 1.20.3 and 1.20.4, built against the newer of them. Java 17, like the game.
minecraft_version=1.20.4
minecraft_range=1.20.3-1.20.4
java_version=17
obfuscated=true
platforms=fabric,neoforge
neoforge_platform=neoforge
compat=1.20.3 classic
# NeoForge reads META-INF/mods.toml before 20.5.
neoforge_mods_toml=true

fabric_loader_version=0.18.2
fabric_api_version=0.97.3+1.20.4
neoforge_version=20.4.253
modmenu_version=9.2.0

fabric_loader_min=0.16.14
fabric_minecraft_range=>=1.20.3 <1.20.5
neoforge_range=[20.3,20.5)
# NeoForge builds in this range bring a MixinExtras too old for the mod.
bundle_mixinextras=true
neoforge_minecraft_range=[1.20.3,1.20.5)
