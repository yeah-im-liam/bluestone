plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    compileOnly "io.github.llamalad7:mixinextras-common:0.5.0"
    common(project(path: ':common')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    def tokens = [
        version: project.version,
        fabric_loader_min: rootProject.fabric_loader_min,
        fabric_minecraft_range: rootProject.fabric_minecraft_range,
        java_version: rootProject.java_version
    ]
    inputs.properties tokens

    filesMatching('fabric.mod.json') {
        expand tokens
    }
}

jar {
    archiveClassifier = 'raw'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = null
    // Loom only writes this into the unshadowed jar; Fabric Loader reads it to know the jar needs no remapping.
    manifest.attributes('Fabric-Mapping-Namespace': 'official')
}

assemble.dependsOn shadowJar
