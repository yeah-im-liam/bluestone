plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    if (rootProject.obfuscated) {
        modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
        modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
        modCompileOnly "com.terraformersmc:modmenu:$rootProject.modmenu_version"
        common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    } else {
        implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
        implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
        compileOnly "com.terraformersmc:modmenu:$rootProject.modmenu_version"
        common(project(path: ':common')) { transitive false }
    }
    compileOnly "io.github.llamalad7:mixinextras-common:0.5.0"
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    def tokens = [
        version: project.version,
        fabric_loader_min: rootProject.fabric_loader_min,
        fabric_minecraft_range: rootProject.fabric_minecraft_range,
        java_version: rootProject.java_version
    ]
    inputs.properties tokens

    filesMatching('fabric.mod.json') {
        expand tokens
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
}

if (rootProject.obfuscated) {
    // Its own refmap, so it doesn't overwrite the one for the shared mixins.
    loom {
        mixin {
            defaultRefmapName.set('bluestone-fabric-refmap.json')
        }
    }
    shadowJar {
        archiveClassifier = 'dev-shadow'
    }
    remapJar {
        input.set shadowJar.archiveFile
    }
} else {
    jar {
        archiveClassifier = 'raw'
    }
    shadowJar {
        archiveClassifier = null
        // Loom only writes this into the unshadowed jar; Fabric Loader reads it to know the jar needs no remapping.
        manifest.attributes('Fabric-Mapping-Namespace': 'official')
    }
    assemble.dependsOn shadowJar
}
